name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test-lint:
    name: Test & Lint (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & Dependencies
        run: |
          pip install uv
          uv sync --extra dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Mypy Type Check
        run: uv run mypy src/

      - name: Run Pytest Suite
        run: uv run pytest

      - name: Run Executable Benchmarks
        run: uv run python scripts/run_benchmarks.py

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cc-framework:latest
